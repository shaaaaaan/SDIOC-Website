<div #sunFlare
     class="sdioc-sun-flare"
     [class.hovered]="isHovered()"
     [class.text-active]="isTextHovered()"
     [class.idle]="isIdle()"
     [class.touch-device]="isTouchDevice()"
     [class.active]="isVisible()">
  <!-- Heavenly Ambient Atmosphere Bloom Aura Layer -->
  <div class="heavenly-aura-bloom"></div>
  <div class="heavenly-aura-sheen"></div>

  <!-- Radiant Single Golden Star with Glowing Star Rays Rotating Together -->
  <div class="cursor-single-golden-star">
    <svg viewBox="0 0 64 64" class="golden-star-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Outer Radiant Glowing Star Rays (Shining outward from center) -->
      <g class="golden-star-rays">
        <!-- 4 Primary Cardinal Rays -->
        <line x1="32" y1="2" x2="32" y2="12" stroke="url(#brightStarRayGrad)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="62" y1="32" x2="52" y2="32" stroke="url(#brightStarRayGrad)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="32" y1="62" x2="32" y2="52" stroke="url(#brightStarRayGrad)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="2" y1="32" x2="12" y2="32" stroke="url(#brightStarRayGrad)" stroke-width="2.2" stroke-linecap="round"/>

        <!-- 4 Diagonal Secondary Rays -->
        <line x1="10.8" y1="10.8" x2="18.5" y2="18.5" stroke="url(#brightStarRayGrad)" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="53.2" y1="10.8" x2="45.5" y2="18.5" stroke="url(#brightStarRayGrad)" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="53.2" y1="53.2" x2="45.5" y2="45.5" stroke="url(#brightStarRayGrad)" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="10.8" y1="53.2" x2="18.5" y2="45.5" stroke="url(#brightStarRayGrad)" stroke-width="1.6" stroke-linecap="round"/>

        <!-- 8 Micro Shimmer Spikes -->
        <line x1="32" y1="15" x2="32" y2="18" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>
        <line x1="49" y1="32" x2="46" y2="32" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>
        <line x1="32" y1="49" x2="32" y2="46" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>
        <line x1="15" y1="32" x2="18" y2="32" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>
      </g>

      <!-- Outer Diffused Golden Flare Sheen -->
      <path class="star-diffused-sheen" d="M32 6 L35.5 25 L58 32 L35.5 39 L32 58 L28.5 39 L6 32 L28.5 25 Z" fill="url(#brightGoldLuster)" filter="url(#goldenBloom)" opacity="0.65"/>

      <!-- Single Solid Bright Golden Star Body (Sacred 8-Pointed Star of Bethlehem Geometry) -->
      <g class="star-solid-body" filter="url(#clearContrastDropShadow)">
        <!-- 4 Long Cardinal Diamond Points -->
        <path d="M32 8 L35.5 26 L56 32 L35.5 38 L32 56 L28.5 38 L8 32 L28.5 26 Z" fill="url(#pureBrightGoldGrad)" stroke="#ffffff" stroke-width="1"/>
        
        <!-- 4 Diagonal Diamond Sub-Points -->
        <path d="M32 17 L35 27 L47 32 L35 37 L32 47 L29 37 L17 32 L29 27 Z" fill="url(#pureBrightGoldGrad)" stroke="#fff8dc" stroke-width="0.8"/>
        
        <!-- Crisp Prismatic Facet Gleams for Polished Gold Clarity -->
        <path d="M32 8 L35.5 26 L32 32 L28.5 26 Z" fill="#ffffff" opacity="0.65"/>
        <path d="M56 32 L35.5 38 L32 32 L35.5 26 Z" fill="#fff7cd" opacity="0.5"/>
        <path d="M32 56 L28.5 38 L32 32 L35.5 38 Z" fill="#facc15" opacity="0.55"/>
        <path d="M8 32 L28.5 26 L32 32 L28.5 38 Z" fill="#ffffff" opacity="0.55"/>
      </g>

      <!-- Center Radiant Golden Nucleus -->
      <circle cx="32" cy="32" r="3.2" fill="#ffffff" filter="url(#goldenBloom)"/>
      <circle cx="32" cy="32" r="1.8" fill="#ffffff"/>

      <defs>
        <filter id="goldenBloom" x="-12" y="-12" width="88" height="88" filterUnits="userSpaceOnUse">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Sharp, high-contrast dark drop shadow to make the bright gold star pop against any background -->
        <filter id="clearContrastDropShadow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
          <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.95"/>
          <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#78350f" flood-opacity="0.9"/>
        </filter>
        <!-- Vibrant, un-muddy pure luminous gold gradient (white to canary & deep royal gold) -->
        <linearGradient id="pureBrightGoldGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="25%" stop-color="#fff066"/>
          <stop offset="60%" stop-color="#ffd700"/>
          <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
        <linearGradient id="brightGoldLuster" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="40%" stop-color="#fef08a"/>
          <stop offset="80%" stop-color="#fde047"/>
          <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
        <linearGradient id="brightStarRayGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="30%" stop-color="#fff59d"/>
          <stop offset="70%" stop-color="#ffd700"/>
          <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  
  <!-- Radial Sunbeam Rays (Golden rays of celestial light shining outward) -->
  <div class="sun-rays-rotor">
    <div class="sun-ray ray-0"></div>
    <div class="sun-ray ray-45"></div>
    <div class="sun-ray ray-90"></div>
    <div class="sun-ray ray-135"></div>
    <div class="sun-ray ray-180"></div>
    <div class="sun-ray ray-225"></div>
    <div class="sun-ray ray-270"></div>
    <div class="sun-ray ray-315"></div>
  </div>

  <!-- Volumetric Golden Sun Corona / Shimmering Light Flare -->
  <div class="sun-corona"></div>

  <!-- Golden Iris Halo & Ethereal Trailing Light Beam -->
  <div class="sun-iris-ring"></div>
  <div class="sun-trailing-beam"></div>
</div>
